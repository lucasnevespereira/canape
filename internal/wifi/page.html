<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi</title>
<!-- Kept to old CSS on purpose: webOS 4's browser is an old Chromium (no min(), no flex gap). -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #16130f; color: #f3ece2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .qr { width: 62vh; height: 62vh; background: #fff; border-radius: 3vh; padding: 1vh; margin: 0 auto 4vh; }
  .qr svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 5vh; margin: 0 0 1vh; font-weight: 600; }
  p { font-size: 3vh; margin: 0.6vh 0; color: #9c8f7d; }
  b { color: #f3ece2; font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  @media (orientation: portrait) {
    .qr { width: 80vw; height: 80vw; border-radius: 4vw; }
    h1 { font-size: 7vw; }
    p { font-size: 4.5vw; }
  }
</style>
</head>
<body>
<main>
{{if .SSID}}
  <div class="qr">{{.QR}}</div>
  <h1>Scan to join the Wi-Fi</h1>
  <p>Network <b>{{.SSID}}</b></p>
  <p>Password <b>{{.Password}}</b></p>
{{else}}
  <h1>No Wi-Fi saved yet</h1>
  <p>Run <b>canape wifi set</b> on the machine running canape.</p>
{{end}}
</main>
<script>
  // Inside the webOS app, the Back key (461) closes it. In a browser tab PalmSystem is missing, so this does nothing.
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 461 && window.PalmSystem) window.close();
  });
</script>
</body>
</html>
